org.gradle.jvmargs=-Xmx1g
org.gradle.caching=true

# Paper API used at compile time. Bump this when you build for a newer Paper release.
paperApiVersion=1.21.8-R0.1-SNAPSHOT

# Bytecode level of the produced jar. Paper 1.21.x servers run on Java 21+, so 21 keeps the jar
# loadable everywhere. The build itself always runs on a Java 25 toolchain (see build.gradle.kts).
# Set to 25 only if every server you target runs Java 25.
javaRelease=21
