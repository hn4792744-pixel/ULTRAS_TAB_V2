name: Build Plugins

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build Paper
        run: gradle :build --no-daemon

      - name: Build Velocity
        run: gradle :proxy:build --no-daemon

      - name: Upload Paper JAR
        uses: actions/upload-artifact@v4
        with:
          name: ULTRAS_TAB_V1-Paper
          path: build/libs/ULTRAS_TAB_V1-v1.jar
          if-no-files-found: error

      - name: Upload Velocity JAR
        uses: actions/upload-artifact@v4
        with:
          name: ULTRAS_TAB_V1-Velocity
          path: proxy/build/libs/ULTRAS_TAB_V1-velocity-v1.jar
          if-no-files-found: error
